<nav class="w-full bg-(--bg-app) border-b border-(--border-neutral) px-4 md:px-8 overflow-x-auto scrollbar-hide flex gap-6 shrink-0">
  @for (tab of tabs; track tab.route) {
    <a
      [routerLink]="tab.route"
      routerLinkActive="!border-[var(--primary-base)] !text-[var(--primary-base)]"
      class="flex items-center h-12 border-b-[3px] border-transparent text-(--text-aux) hover:text-(--text-main) font-semibold cursor-pointer transition-colors whitespace-nowrap text-sm"
    >
      {{ tab.label }}
    </a>
  }
</nav>
