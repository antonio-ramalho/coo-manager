<div [formGroup]="group" class="grid grid-cols-1 md:grid-cols-12 gap-3.5 md:gap-4">

  @if (showProductSelect) {
  <div class="flex flex-col gap-1 md:col-span-12">
    <label class="txt-label" for="inputProductId">Nome do produto</label>
    <app-searchable-select id="inputProductId" formControlName="inputProductId" [options]="products"
      [searchFn]="searchProductsFn" valueKey="id" [labelFormatter]="productLabelFormatter"
      [searchFunction]="productSearchFunction"
      [isInvalid]="!!(group.get('inputProductId')?.invalid && group.get('inputProductId')?.touched)"
      placeholder="Pesquise o produto por nome ou código..." notFoundText="Nenhum produto encontrado no catálogo.">
    </app-searchable-select>
    <app-input-error [control]="group.get('inputProductId')"></app-input-error>
  </div>
  }

  <div class="flex flex-col gap-1" [class.md:col-span-4]="true" [class.col-span-12]="true">
    <label class="txt-label" for="batchCode">Código do Lote</label>
    <input class="input-base txt-body" id="batchCode" name="batchCode" type="text" formControlName="batchCode"
      [class.input-error]="group.get('batchCode')?.invalid && group.get('batchCode')?.touched"
      placeholder="Código do lote">
    <app-input-error [control]="group.get('batchCode')"></app-input-error>
  </div>

  <div class="flex flex-col gap-1" [class.md:col-span-4]="true" [class.col-span-12]="true">
    <label class="txt-label" for="quantityValue">Quantidade Inicial</label>
    <input
      class="input-base txt-body [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
      id="quantityValue" name="quantityValue" type="number" step="0.01" min="0" formControlName="quantityValue"
      [class.input-error]="group.get('quantityValue')?.invalid && group.get('quantityValue')?.touched"
      placeholder="50.00">
    <app-input-error [control]="group.get('quantityValue')"></app-input-error>
  </div>

  <div class="flex flex-col gap-1" [class.md:col-span-4]="true" [class.col-span-12]="true">
    <label class="txt-label" for="expirationDate">Data de Validade</label>
    <app-date-input
      inputId="expirationDate"
      formControlName="expirationDate"
      placeholder="DD/MM/AAAA"
      [minDate]="'today'"
      [isInvalid]="!!(group.get('expirationDate')?.invalid && group.get('expirationDate')?.touched)"
    ></app-date-input>
    <app-input-error [control]="group.get('expirationDate')"></app-input-error>
  </div>

</div>
