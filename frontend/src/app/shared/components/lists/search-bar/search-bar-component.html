<div class="flex gap-2 w-full">
  <input
    type="text"
    [formControl]="searchControl"
    [placeholder]="placeholder"
    class="border p-2 rounded flex-1 border-[var(--border-neutral)] focus:border-[var(--border-hover)] focus:outline-none rounded-[var(--radius-btn)]"
  />
  <!-- TODO: conectar ao modal de filtros avançados quando for implementado. -->
  <button
    type="button"
    appButton
    variant="surface"
    size="icon"
    class="w-10 h-10 shrink-0"
    aria-label="Filtros"
    (click)="filterClick.emit()"
  >
    <svg lucideFunnel class="w-5 h-5"></svg>
  </button>
</div>
