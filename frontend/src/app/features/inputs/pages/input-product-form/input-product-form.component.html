<div class="flex flex-col w-full h-full min-h-0 overflow-y-auto p-3 sm:p-4 md:py-3 md:px-6 custom-scrollbar">
  <app-page-title [title]="isEditing ? 'Edição de insumo' : 'Cadastro de insumo'" [showBackButton]="true"
    (back)="cancel()">
  </app-page-title>

  <form (ngSubmit)="save()" class="flex flex-col w-full min-h-0">
    <app-stepper-layout [steps]="stepLabels" [currentStep]="currentPage" [nextDisabled]="isCurrentStepInvalid"
      [submitDisabled]="isSubmitDisabled" [isSubmitting]="isSubmitting" (next)="nextPage()" (back)="backPage()"
      (cancel)="cancel()">
      @switch (currentPage) {
      @case (1) {
      <h3 class="txt-h2 mb-3">Informações do Insumo</h3>
      <app-product-form [group]="productGroup"></app-product-form>

      @if (!isEditing) {
      <div class="flex flex-col gap-1.5 mt-4 pt-3.5 border-t border-[var(--border-neutral)]">
        <label class="txt-label">Deseja cadastrar o lote inicial agora?</label>
        <div class="flex items-center gap-3 mt-0.5">
          <label
            class="flex items-center gap-2 cursor-pointer py-2 px-3.5 rounded-[var(--radius-btn)] border border-[var(--border-neutral)] bg-[var(--bg-surface)] hover:bg-[var(--bg-surface-hover)] transition-all select-none"
            [class.border-[var(--primary-base)]]="!includeInitialBatch()"
            [class.bg-[var(--primary-light)]]="!includeInitialBatch()">
            <input type="radio" name="initialBatchRadio" [checked]="!includeInitialBatch()"
              (change)="setInitialBatch(false)" class="w-4 h-4 accent-[var(--primary-base)] cursor-pointer">
            <span class="txt-body text-sm font-medium">Não, apenas o insumo</span>
          </label>

          <label
            class="flex items-center gap-2 cursor-pointer py-2 px-3.5 rounded-[var(--radius-btn)] border border-[var(--border-neutral)] bg-[var(--bg-surface)] hover:bg-[var(--bg-surface-hover)] transition-all select-none"
            [class.border-[var(--primary-base)]]="includeInitialBatch()"
            [class.bg-[var(--primary-light)]]="includeInitialBatch()">
            <input type="radio" name="initialBatchRadio" [checked]="includeInitialBatch()"
              (change)="setInitialBatch(true)" class="w-4 h-4 accent-[var(--primary-base)] cursor-pointer">
            <span class="txt-body text-sm font-medium">Sim, cadastrar lote inicial</span>
          </label>
        </div>
      </div>
      }
      }
      @case (2) {
      <h3 class="txt-h2 mb-3">Dados do Lote Inicial</h3>
      <app-batch-form [group]="batchGroup" [showProductSelect]="false"></app-batch-form>
      }
      }
    </app-stepper-layout>
  </form>
</div>
