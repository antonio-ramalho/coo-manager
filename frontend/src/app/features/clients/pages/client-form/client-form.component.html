<app-standard-form-layout
  [title]="isEditing ? 'Edição de cliente' : 'Cadastro de cliente'"
  featureName="Cadastro de Clientes"
  (cancel)="cancel()"
>
  <form [formGroup]="masterForm" (ngSubmit)="save()" (submit)="$event.preventDefault()" class="flex flex-col flex-1 w-full h-full min-h-0">
    <app-stepper-layout
      [steps]="stepLabels"
      [currentStep]="currentPage"
      [nextDisabled]="isCurrentStepInvalid"
      [submitDisabled]="masterForm.invalid"
      [isSubmitting]="isSubmitting"
      (next)="nextPage()"
      (back)="backPage()"
      (cancel)="cancel()"
    >
      @switch (currentPage) {
        @case (1) {
          <h3 class="txt-h2 mb-3">Informações Básicas</h3>
          <app-person-form [group]="basicInfoGroup"></app-person-form>
        }
        @case (2) {
          <h3 class="txt-h2 mb-3">Dados Específicos</h3>
          @if (personType === PersonType.NATURAL) {
            <app-natural-person-form-component [group]="specificDataGroup"></app-natural-person-form-component>
          } @else {
            <app-juridic-person-form [group]="specificDataGroup"></app-juridic-person-form>
          }
        }
        @case (3) {
          <h3 class="txt-h2 mb-3">Endereço</h3>
          <app-address-form [group]="addressGroup"></app-address-form>
        }
      }
    </app-stepper-layout>
  </form>
</app-standard-form-layout>
