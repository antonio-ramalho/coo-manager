<app-details-layout-component class="layout-container">
  <app-product-details-header
    details-header
    [id]="product.id"
    [name]="product.productName"
    [code]="product.productCode"
    [status]="product.productCatalogStatus"
    (editProduct)="edit.emit($event)">
  </app-product-details-header>

  <div details-body class="details-body-container">
    <div class="cards-grid">
      <app-product-basic-info-card
        [id]="product.id"
        [price]="product.price.value"
        [measureUnit]="product.measureUnit"
        [ncm]="product.ncm"
        [productCode]="product.productCode">
      </app-product-basic-info-card>

      <app-product-stock-summary-card
        [batches]="product.batches ?? []"
        [unitPrice]="product.price.value"
        [measureUnit]="product.measureUnit">
      </app-product-stock-summary-card>
    </div>

    <div class="batches-section">
      <app-product-batches-card
        [batches]="product.batches ?? []"
        [measureUnit]="product.measureUnit">
      </app-product-batches-card>
    </div>
  </div>
</app-details-layout-component>
