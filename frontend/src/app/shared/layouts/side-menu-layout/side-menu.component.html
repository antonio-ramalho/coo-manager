<aside class="aside-container" [class.w-[260px]]="isExpanded" [class.w-[80px]]="!isExpanded">
  <button
    (click)="toggleMenu()"
    class="toggle-button">
    @if (isExpanded) {
      <svg lucideChevronLeft class="svg-icon"></svg>
    } @else if (!isExpanded) {
      <svg lucideChevronRight class="svg-icon"></svg>
    }
  </button>

  <div class="h-17.75 flex items-center pl-6 overflow-hidden shrink-0 whitespace-nowrap ">

    <div class="w-8 h-8 bg-(--primary-hover) rounded-lg flex items-center justify-center text-white text-xs font-bold shrink-0">
      Lg
    </div>

    <span
      class="text-xl font-bold text-(--text-main) ml-4 transition-opacity duration-300"
      [class.opacity-0]="!isExpanded"
      [class.opacity-100]="isExpanded">
      CooManager
    </span>
  </div>

  <div class="w-full h-px bg-(--border-neutral) shrink-0"></div>

  <div class="flex-1 py-6 flex flex-col gap-2 overflow-y-auto overflow-x-hidden scrollbar-hide">

    <div class="h-6 flex items-center pl-5 mb-2 overflow-hidden whitespace-nowrap">
      <span
        class="txt-label transition-opacity duration-300"
        [class.opacity-0]="!isExpanded"
        [class.opacity-100]="isExpanded">
        Menu Principal
      </span>
    </div>

    <nav>
      <ul class="flex flex-col gap-2">

        <li>
          <a routerLink="/home/dashboard" routerLinkActive="active" class="menu-link" [title]="!isExpanded ? 'Dashboard' : ''">
            <div class="link-icon-container">
              <svg lucideLayoutDashboard class="icon"></svg>
            </div>

            <span class="link-span"
                  [class.opacity-0]="!isExpanded"
                  [class.opacity-100]="isExpanded">
              Dashboard
            </span>
          </a>
        </li>

        <li>
          <a routerLink="/home/logistica" routerLinkActive="active" class="menu-link" [title]="!isExpanded ? 'Logística' : ''">
            <div class="link-icon-container">
              <svg lucideTruck class="icon"></svg>
            </div>
            <span class="link-span"
                  [class.opacity-0]="!isExpanded"
                  [class.opacity-100]="isExpanded">
              Logística
            </span>
          </a>
        </li>

        <li>
          <a routerLink="/home/financeiro" routerLinkActive="active" class="menu-link" [title]="!isExpanded ? 'Financeiro' : ''">
            <div class="link-icon-container">
              <svg lucideDollarSign class="icon"></svg>
            </div>
            <span class="link-span"
                  [class.opacity-0]="!isExpanded"
                  [class.opacity-100]="isExpanded">
              Financeiro
            </span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="h-6 flex items-center pl-5 mb-2 overflow-hidden whitespace-nowrap">
      <span
        class="txt-label transition-opacity duration-300"
        [class.opacity-0]="!isExpanded"
        [class.opacity-100]="isExpanded">
        Vendas
      </span>
    </div>

    <nav>
      <ul class="flex flex-col gap-2">

        <li>
          <a routerLink="/home/clientes" routerLinkActive="active" class="menu-link" [title]="!isExpanded ? 'clientes' : ''">
            <div class="link-icon-container">
              <svg lucideUsers class="icon"></svg>
            </div>
            <span class="link-span"
                  [class.opacity-0]="!isExpanded"
                  [class.opacity-100]="isExpanded">
              Clientes
            </span>
          </a>
        </li>

        <li>
          <a routerLink="/home/vendas" routerLinkActive="active" class="menu-link" [title]="!isExpanded ? 'Vendas' : ''">
            <div class="link-icon-container">
              <svg lucideShoppingCart class="icon"></svg>
            </div>
            <span class="link-span"
                  [class.opacity-0]="!isExpanded"
                  [class.opacity-100]="isExpanded">
              Vendas
            </span>
          </a>
        </li>

        <li>
          <a routerLink="/home/insumos" routerLinkActive="active" class="menu-link" [title]="!isExpanded ? 'Insumos' : ''">
            <div class="link-icon-container">
              <svg lucideBarcode class="icon"></svg>
            </div>
            <span class="link-span"
                  [class.opacity-0]="!isExpanded"
                  [class.opacity-100]="isExpanded">
              Insumos
            </span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</aside>
