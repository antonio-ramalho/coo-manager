<div class="flex flex-col lg:flex-row gap-6 lg:gap-8 items-start w-full max-w-7xl mx-auto mt-2 md:mt-6">
  <aside class="w-full lg:w-72 lg:shrink-0 flex flex-col gap-4 lg:gap-8 lg:sticky lg:top-6">
    <div>
      <h2 class="txt-h2 mb-1">Progresso do Cadastro</h2>
      <p class="txt-aux text-sm">Passo {{ currentStep }} de {{ steps.length }}: <strong>{{ steps[currentStep - 1] }}</strong></p>
      <div class="w-full bg-[var(--border-neutral)] h-2 rounded-full mt-3 overflow-hidden">
        <div
          class="bg-[var(--primary-base)] h-full transition-all duration-300"
          [style.width.%]="(currentStep / steps.length) * 100">
        </div>
      </div>
    </div>

    <!-- Lista detalhada dos passos: oculta no mobile para não poluir, exibida em telas grandes -->
    <nav class="hidden lg:flex flex-col gap-3">
      @for (stepName of steps; track $index) {
        <div
          class="w-full text-left p-3 rounded-[var(--radius-card)] flex items-center gap-4 transition-all duration-200 border"
          [ngClass]="currentStep === ($index + 1) ?
            'bg-[var(--primary-light)] border-[var(--primary-base)] shadow-sm' :
            'border-transparent bg-transparent'">

          <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold shrink-0 transition-colors"
               [ngClass]="currentStep === ($index + 1) ?
                 'bg-[var(--primary-base)] text-white' :
                 'bg-[var(--border-neutral)] text-[var(--text-aux)]'">
            {{ $index + 1 }}
          </div>

          <span class="font-medium text-sm transition-colors"
                [ngClass]="currentStep === ($index + 1) ? 'text-[var(--primary-base)]' : 'text-[var(--text-aux)]'">
            {{ stepName }}
          </span>
        </div>
      }
    </nav>
  </aside>

  <main class="w-full flex-1 bg-[var(--bg-surface)] border border-[var(--border-neutral)] rounded-[var(--radius-card)] flex flex-col shadow-sm overflow-hidden lg:min-h-[550px]">
    <div class="flex-1 p-4 sm:p-6 lg:p-8">
      <ng-content></ng-content>
    </div>

    <footer class="bg-[var(--bg-surface-hover)] p-4 sm:p-6 border-t border-[var(--border-neutral)] flex flex-col-reverse sm:flex-row justify-between items-center gap-3 sm:gap-4 mt-auto">
      <button type="button" appButton variant="surface" class="w-full sm:w-auto" (click)="cancel.emit()">
        Cancelar
      </button>

      <div class="flex items-center gap-3 sm:gap-4 w-full sm:w-auto justify-end">
        @if (currentStep > 1) {
          <button type="button" appButton variant="outline" class="flex-1 sm:flex-none" (click)="back.emit()">
            ← Anterior
          </button>
        }

        @if (currentStep < steps.length) {
          <button type="button" appButton variant="primary" class="flex-1 sm:flex-none" (click)="next.emit()" [disabled]="nextDisabled">
            Próximo Passo →
          </button>
        } @else {
          <button type="submit" appButton variant="primary" class="flex-1 sm:flex-none" [disabled]="submitDisabled || isSubmitting">
            @if (isSubmitting) {
              A enviar...
            } @else {
              Finalizar Cadastro
            }
          </button>
        }
      </div>
    </footer>
  </main>
</div>
