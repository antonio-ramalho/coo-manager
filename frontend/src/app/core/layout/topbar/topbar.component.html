<header class="topbar-header">
  <div class="left-section">
    <button type="button" (click)="menuClick.emit()" class="btn-mobile-menu" aria-label="Abrir menu">
      <svg lucideMenu class="menu-icon"></svg>
    </button>

    @if (isDesktop && subNavTabs(); as tabs) {
    <app-sub-nav [tabs]="tabs" class="h-full"></app-sub-nav>
    }

    <div class="h-full flex items-center">
      <ng-content></ng-content>
    </div>
  </div>

  <div class="right-section">
    <div class="quick-actions-group">
      <button type="button" class="btn-icon-action" aria-label="Buscar">
        <svg lucideSearch class="icon-svg"></svg>
      </button>
      <button type="button" class="btn-icon-action" aria-label="Notificações">
        <svg lucideBell class="icon-svg"></svg>
        <span class="notification-badge"></span>
      </button>
    </div>

    <div class="divider-vertical"></div>

    <div class="relative">
      <app-action-menu
        [items]="getUserMenuItems()"
        minWidth="220px"
        placement="bottom-right"
        triggerAriaLabel="Abrir menu do usuário"
      >
        <div menu-trigger class="user-menu-trigger">
          <div class="user-avatar">
            <svg lucideUser class="avatar-icon"></svg>
          </div>
          <div class="user-info-text">
            <span class="user-name">
              {{ getUserName() }}
            </span>
            <span class="user-role">
              {{ getUserRole() }}
            </span>
          </div>
          <svg lucideChevronDown class="chevron-icon"></svg>
        </div>

        <div menu-header class="menu-header-content">
          <span class="connected-label">Conectado como</span>
          <span class="connected-name">{{ getUserName() }}</span>
          <span class="connected-email">{{ currentUser()?.email }}</span>
        </div>
      </app-action-menu>
    </div>
  </div>
</header>
