<div class="h-screen flex flex-col overflow-hidden">

  <header class="w-full bg-[var(--white-background)] px-8 py-4 flex items-center justify-between shadow-sm flex-shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-[var(--green-highlight)] rounded-full flex items-center justify-center text-[var(--white-background)] text-xs">Logo</div>
      <span class="text-xl font-bold text-[var(--green-highlight)]">CooManager</span>
    </div>

    <div class="flex items-center gap-6">
      <svg lucideBell class="w-6 h-6 text-[var(--auxiliary-txt)] hover:text-[var(--green-hoover)] cursor-pointer transition-colors"></svg>
      <div class="w-10 h-10 rounded-full bg-[var(--surface-base)] flex items-center justify-center border border-[var(--border-light)] cursor-pointer hover:bg-[var(--surface-hover)] transition-colors">
        <svg lucideUser class="w-6 h-6 text-[var(--auxiliary-txt)]"></svg>
      </div>
    </div>
  </header>

  <div class="flex flex-1 gap-6 p-8 overflow-hidden">

    <aside class="w-[300px] flex flex-col gap-6 flex-shrink-0">
      <app-card-user [dados]="usuarioLogado"></app-card-user>
      <app-card-box>
        <app-card-menu></app-card-menu>
      </app-card-box>
    </aside>

    <main class="flex-1 overflow-y-auto pr-2 scrollbar-hide">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
