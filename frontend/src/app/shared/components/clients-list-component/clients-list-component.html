<div class="p-4">
  <h2 class="text-xl mb-4">Gerenciamento</h2>

  <app-search-bar-component (modifiedSearch)="applyFilters($event)"></app-search-bar-component>

  @if (page$ | async; as page) {
    <div class="grid gap-4">
      @if (page.content.length === 0) {
        <div
          class="flex items-center justify-center p-6 text-(--text-aux) text-sm text-center border-2 border-dashed border-(--border-neutral) rounded-(--radius-card)"
        >
          Nenhum cliente encontrado.
        </div>
      }
      @for (item of page.content; track item.id) {
        <app-item-client-component
          [id]="item.id"
          [name]="item.legalName"
          [documentNumber]="item.documentNumber"
        >
        </app-item-client-component>
      }
    </div>

    <app-pagination-component
      [currentPage]="currentPage"
      [totalItens]="page.totalElements"
      [itensPerPage]="10"
      (swappedPage)="swappedPage($event)"
    >
    </app-pagination-component>
  } @else {
    <div class="flex justify-center p-8">
      <p class="text-gray-500">A carregar dados...</p>
    </div>
  }
</div>
