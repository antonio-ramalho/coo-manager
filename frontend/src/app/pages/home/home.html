<div class="w-full h-screen flex overflow-hidden bg-[var(--bg-app)] text-[var(--text-main)]">

  <app-side-menu></app-side-menu>

  <div class="flex-1 flex flex-col min-w-0">

    <header class="h-[72px] px-8 bg-[var(--bg-surface)] border-b border-[var(--border-neutral)]">
      <div class="content-interface flex items-center justify-between flex-shrink-0 z-10">
        <div></div>

        <div class="flex items-center gap-6">

          <div class="flex items-center gap-2">
            <button class="p-2 text-[var(--text-aux)] hover:text-[var(--text-main)] hover:bg-[var(--bg-surface-hover)] rounded-full transition-colors focus:outline-none">
              <svg lucideSearch class="w-5 h-5"></svg>
            </button>
            <button class="p-2 text-[var(--text-aux)] hover:text-[var(--text-main)] hover:bg-[var(--bg-surface-hover)] rounded-full transition-colors focus:outline-none relative">
              <svg lucideBell class="w-5 h-5"></svg>
              <span class="absolute top-2 right-2.5 w-2 h-2 bg-red-500 rounded-full"></span>
            </button>
          </div>

          <div class="w-px h-8 bg-[var(--border-neutral)]"></div>

          <div class="flex items-center gap-3 cursor-pointer group">
            <div class="w-10 h-10 rounded-full bg-[var(--bg-surface-hover)] border border-[var(--border-neutral)] flex items-center justify-center overflow-hidden">
              <svg lucideUser class="w-6 h-6 text-[var(--text-aux)] mt-1 group-hover:text-[var(--text-main)] transition-colors"></svg>
            </div>
            <div class="flex flex-col">
            <span class="text-sm font-semibold text-[var(--text-main)] group-hover:text-black transition-colors">
              {{ usuarioLogado.nome }}
            </span>
              <span class="text-xs text-[var(--text-aux)]">
              {{ usuarioLogado.cargo }}
            </span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="content-interface overflow-y-auto scrollbar-hide">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
