<!-- Bloqueio no mobile via diretiva @if: previne requisições desnecessárias em telas menores -->
@if (!isDesktop()) {
<app-desktop-only-notice featureName="Catálogo de Insumos">
  <a appButton variant="primary" routerLink="/home/insumos/cadastro">Novo insumo</a>
</app-desktop-only-notice>
} @else {
<div class="content-interface catalog-container">
  <header class="header-container">
    <h1 class="txt-h1">Catálogo</h1>
    <button type="button" appButton variant="primary" routerLink="/home/insumos/cadastro">Novo insumo</button>
  </header>

  <div class="flex-1 flex min-h-0" style="gap: var(--space-layout)">
    <aside class="aside-container custom-scrollbar">
      @let pageData = (page$ | async) ?? { content: [], totalElements: 0 };
      <app-generic-list class="flex-1 flex flex-col min-h-0" [items]="pageData.content"
        [currentPage]="currentPage" [loading]="loadingList" loadingText="Buscando insumos no catálogo..."
        searchPlaceholder="Buscar por nome, código ou ncm..." altText="Nenhum insumo encontrado."
        (searchChanged)="applyFilters($event)" (pageChanged)="swappedPage($event)" (viewDetails)="viewDetails($event)"
        (deactivate)="deactivateProduct($event)" (activate)="activateProduct($event)" (edit)="editProduct($event)">
      </app-generic-list>
    </aside>

    <main class="main-container custom-scrollbar">
      @let details = productDetails$ | async;
      @if (loadingDetails) {
      <div class="card card-details-container">
        <app-loading-spinner size="md" message="Carregando detalhes do insumo..."></app-loading-spinner>
      </div>
      } @else if (details) {
      <app-input-product-details-panel [product]="details" (edit)="editProduct($event)">
      </app-input-product-details-panel>
      } @else {
      <div class="card card-details-container">
        <div class="empty-state text-(--text-aux) text-sm">
          Selecione um insumo na lista para ver os detalhes.
        </div>
      </div>
      }
    </main>
  </div>
</div>
}
