<div
  class="card-interactive flex justify-between p-3 transition-all duration-200 cursor-pointer w-full min-w-0"
>
  <div class="flex justify-between gap-2 size-full min-w-0">
    <div class="flex items-start gap-3 justify-between min-w-0 flex-1">
      <div class="flex flex-col min-w-0 flex-1">
        <span class="text-base font-semibold text-(--text-main) truncate max-w-full block" [title]="title">{{
          title
        }}</span>
        <span class="text-xs text-(--text-aux) truncate max-w-full block" [title]="subtitle">{{ subtitle }}</span>
      </div>
    </div>

    <div class="flex flex-col items-center justify-between shrink-0">
      <div (click)="$event.stopPropagation()">
        <app-action-menu
          [items]="getMenuItems()"
          triggerTitle="Opções"
          triggerAriaLabel="Abrir opções do item"
        ></app-action-menu>
      </div>

      <button
        appButton
        variant="surface"
        size="icon"
        class="w-6 h-6 p-1 rounded"
        (click)="onShowDetails($event)"
      >
        <svg lucideArrowRight class="w-3 h-3"></svg>
      </button>
    </div>
  </div>
</div>
