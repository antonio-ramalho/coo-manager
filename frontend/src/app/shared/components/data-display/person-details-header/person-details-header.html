<div class="header-root">
  <div class="profile-group">
    <div class="avatar-placeholder"></div>

    <div class="profile-info">
      <div class="name-status-row">
        <h2 class="person-name" [title]="name">{{ name }}</h2>
        @if (status === Status.ACTIVE || status === 'ACTIVE') {
          <span class="status-badge status-active">
            {{ status | statusPipe }}
          </span>
        }
        @else {
          <span class="status-badge status-inactive">
            {{ status | statusPipe }}
          </span>
        }
      </div>
      <span class="document-text">{{ documentNumber | cpfCnpj }}</span>
    </div>
  </div>

  <div class="actions-group">
    <button appButton variant="surface" size="icon">
      <svg lucideMessageCircle class="w-5 h-5"></svg>
    </button>
    <button appButton variant="surface" size="icon" (click)="onEditClient($event)">
      <svg lucideSquarePen class="w-5 h-5"></svg>
    </button>
  </div>
</div>
