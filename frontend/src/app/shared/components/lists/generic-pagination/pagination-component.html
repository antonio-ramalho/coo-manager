<div class="pagination-wrapper">
  <!-- Versão Mobile Compacta -->
  <div class="pagination-mobile">
    <button
      type="button"
      (click)="return()"
      [disabled]="!canReturn"
      class="btn-mobile-nav"
    >
      Anterior
    </button>
    <p class="page-indicator-mobile">
      {{ currentPage }} / {{ totalPages }}
    </p>
    <button
      type="button"
      (click)="advance()"
      [disabled]="!canAdvance"
      class="btn-mobile-nav"
    >
      Próxima
    </button>
  </div>

  <!-- Versão Tablet / Desktop Completa -->
  <div class="pagination-desktop">
    <div>
      <p class="page-info-text">
        Página <span class="page-number-highlight">{{ currentPage }}</span> de
        <span class="page-number-highlight">{{ totalPages }}</span>
        <span class="page-total-count">({{ totalItens }} no total)</span>
      </p>
    </div>

    <div>
      <nav class="pagination-nav-group" aria-label="Pagination">
        <button
          type="button"
          (click)="return()"
          [disabled]="!canReturn"
          class="nav-btn"
          aria-label="Anterior"
        >
          <svg class="nav-arrow-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z"
              clip-rule="evenodd"
            />
          </svg>
        </button>

        <button
          type="button"
          (click)="advance()"
          [disabled]="!canAdvance"
          class="nav-btn"
          aria-label="Próxima"
        >
          <svg class="nav-arrow-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </nav>
    </div>
  </div>
</div>
