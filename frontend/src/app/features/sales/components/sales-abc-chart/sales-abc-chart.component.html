<div class="card chart-card">
  <div class="chart-header">
    <div>
      <h3 class="txt-h2 text-base md:text-lg">Insumos Mais Vendidos</h3>
      <p class="text-xs text-[var(--text-aux)] mt-0.5">Distribuição do volume comercializado por produto</p>
    </div>
  </div>

  <div class="chart-body">
    @if (loading) {
    <div class="chart-state-msg">
      <app-loading-spinner size="md" message="Carregando dados da Curva ABC..."></app-loading-spinner>
    </div>
    } @else if (!products || products.length === 0) {
    <div class="chart-state-msg">
      <span>Nenhum dado de venda registrado.</span>
    </div>
    } @else {
    <div class="canvas-wrapper">
      <canvas baseChart [data]="chartData" [type]="chartType" [options]="chartOptions"></canvas>
    </div>
    }
  </div>
</div>
