<div class="flex flex-col lg:flex-row gap-4 lg:gap-6 items-stretch w-full max-w-7xl mx-auto mt-0">
  <aside class="w-full lg:w-64 lg:shrink-0 flex flex-col gap-3 lg:gap-4">
    <div>
      <h2 class="txt-h2 mb-0.5">Progresso do Cadastro</h2>
      <p class="txt-aux text-xs sm:text-sm">Passo {{ currentStep }} de {{ steps.length }}: <strong>{{ steps[currentStep
          - 1] }}</strong></p>
      <div class="w-full bg-[var(--border-neutral)] h-1.5 rounded-full mt-2 overflow-hidden">
        <div class="bg-[var(--primary-base)] h-full transition-all duration-300"
          [style.width.%]="(currentStep / steps.length) * 100">
        </div>
      </div>
    </div>

    <!-- Lista detalhada dos passos -->
    <nav class="hidden lg:flex flex-col gap-2">
      @for (stepName of steps; track $index) {
      <div
        class="w-full text-left py-2 px-3 rounded-[var(--radius-card)] flex items-center gap-3 transition-all duration-200 border"
        [ngClass]="currentStep === ($index + 1) ?
            'bg-[var(--primary-light)] border-[var(--primary-base)] shadow-xs' :
            'border-transparent bg-transparent'">

        <div class="w-7 h-7 rounded-md flex items-center justify-center text-xs font-bold shrink-0 transition-colors"
          [ngClass]="currentStep === ($index + 1) ?
                 'bg-[var(--primary-base)] text-white' :
                 'bg-[var(--border-neutral)] text-[var(--text-aux)]'">
          {{ $index + 1 }}
        </div>

        <span class="font-medium text-xs sm:text-sm transition-colors"
          [ngClass]="currentStep === ($index + 1) ? 'text-[var(--primary-base)] font-semibold' : 'text-[var(--text-aux)]'">
          {{ stepName }}
        </span>
      </div>
      }
    </nav>
  </aside>

  <main
    class="w-full flex-1 bg-[var(--bg-surface)] border border-[var(--border-neutral)] rounded-[var(--radius-card)] flex flex-col shadow-xs justify-between">
    <div class="flex-1 p-4 sm:p-5 lg:p-6">
      <ng-content></ng-content>
    </div>

    <footer
      class="bg-[var(--bg-surface-hover)] rounded-b-[var(--radius-card)] py-3 px-4 sm:px-6 border-t border-[var(--border-neutral)] flex flex-col-reverse sm:flex-row justify-between items-center gap-3 mt-auto">
      <button type="button" appButton variant="surface" class="w-full sm:w-auto" (click)="cancel.emit()">
        Cancelar
      </button>

      <div class="flex items-center gap-3 sm:gap-4 w-full sm:w-auto justify-end">
        @if (currentStep > 1) {
        <button type="button" appButton variant="outline" class="flex-1 sm:flex-none" (click)="back.emit()">
          ← Anterior
        </button>
        }

        @if (currentStep < steps.length) { <button type="button" appButton variant="primary" class="flex-1 sm:flex-none"
          (click)="next.emit()" [disabled]="nextDisabled">
          Próximo Passo →
          </button>
          } @else {
          <button type="submit" appButton variant="primary" class="flex-1 sm:flex-none"
            [disabled]="submitDisabled || isSubmitting">
            @if (isSubmitting) {
            A enviar...
            } @else {
            Finalizar Cadastro
            }
          </button>
          }
      </div>
    </footer>
  </main>
</div>
