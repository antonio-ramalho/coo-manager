<div class="app-layout-root">
  @if (!isDesktop() && isMobileMenuOpen()) {
  <div class="mobile-overlay" (click)="closeMobileMenu()" aria-hidden="true"></div>
  }

  <app-sidebar class="sidebar-wrapper"
    [class.sidebar-mobile]="!isDesktop()"
    [class.sidebar-closed]="!isDesktop() && !isMobileMenuOpen()"
    [class.sidebar-open]="!isDesktop() && isMobileMenuOpen()"
    [sections]="sections()"
    [collapsed]="isDesktop() && isSidebarCollapsed()"
    [isMobile]="!isDesktop()"
    (toggleCollapse)="toggleCollapse()"
    (closeMobile)="closeMobileMenu()"
    (navigate)="closeMobileMenu()">
  </app-sidebar>

  <div class="main-content-column">
    <app-topbar [isDesktop]="isDesktop()" (menuClick)="openMobileMenu()"></app-topbar>
    <main class="main-outlet"
      [class.overflow-hidden]="isDesktop()"
      [class.overflow-scroll]="!isDesktop()">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
