<header class="flex justify-between items-center w-full h-18 px-8 bg-white border-b border-(--border-neutral) shrink-0">

  <div class="h-full flex items-center">
    <ng-content></ng-content>
  </div>

  <div class="flex items-center gap-6">

    <div class="flex items-center gap-2">
      <button class="p-2 text-(--text-aux) hover:text-(--text-main) hover:bg-(--bg-surface-hover) rounded-full transition-colors focus:outline-none">
        <svg lucideSearch class="w-5 h-5"></svg>
      </button>
      <button class="p-2 text-(--text-aux) hover:text-(--text-main) hover:bg-(--bg-surface-hover) rounded-full transition-colors focus:outline-none relative">
        <svg lucideBell class="w-5 h-5"></svg>
        <span class="absolute top-2 right-2.5 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>
    </div>

    <div class="w-px h-8 bg-(--border-neutral)"></div>

    <div class="flex items-center gap-3 cursor-pointer group">
      <div class="w-10 h-10 rounded-full bg-(--bg-surface-hover) border border-(--border-neutral) flex items-center justify-center overflow-hidden">
        <svg lucideUser class="w-6 h-6 text-(--text-aux) mt-1 group-hover:text-(--text-main) transition-colors"></svg>
      </div>
      <div class="flex flex-col">
            <span class="text-sm font-semibold text-(--text-main) group-hover:text-black transition-colors">
              {{ usuarioLogado.nome }}
            </span>
        <span class="text-xs text-(--text-aux)">
              {{ usuarioLogado.cargo }}
            </span>
      </div>
    </div>
  </div>
</header>
